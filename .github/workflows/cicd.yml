name: CI/CD Pipeline

on:
  push:
    branches: [main, release]
  pull_request:
    branches: [main, release]
  workflow_dispatch:

env:
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
  IMAGE_VERSION: ${{ github.run_number }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5 with: {python-version: '3.11'}
      - uses: astral-sh/setup-uv@v4
      - run: cd backend && uv sync && uv run ruff check .
      - uses: actions/setup-node@v4 with: {node-version: '22', cache: 'npm', cache-dependency-path: frontend/package-lock.json}
      - run: cd frontend && npm ci && npm run lint || true

  build-backend:
    runs-on: ubuntu-latest
    needs: [lint]
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3 with: {username: ${{ env.DOCKERHUB_USERNAME }}, password: ${{ secrets.DOCKERHUB_TOKEN }}}
      - run: echo "name=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT
      - uses: docker/build-push-action@v6 with: {context: ., file: docker/Dockerfile, platforms: linux/amd64, push: true, tags: '${{ env.DOCKERHUB_USERNAME }}/ai_story-backend:${{ env.IMAGE_VERSION }} ${{ env.DOCKERHUB_USERNAME }}/ai_story-backend:latest', cache-from: type=gha, cache-to: type=gha,mode=max}

  build-frontend:
    runs-on: ubuntu-latest
    needs: [lint]
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3 with: {username: ${{ env.DOCKERHUB_USERNAME }}, password: ${{ secrets.DOCKERHUB_TOKEN }}}
      - run: echo "name=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT
      - uses: docker/build-push-action@v6 with: {context: ., file: docker/frontend.Dockerfile, platforms: linux/amd64, push: true, tags: '${{ env.DOCKERHUB_USERNAME }}/ai_story-frontend:${{ env.IMAGE_VERSION }} ${{ env.DOCKERHUB_USERNAME }}/ai_story-frontend:latest', cache-from: type=gha, cache-to: type=gha,mode=max}

  deploy:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/release'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: appleboy/ssh-action@v1.0.3 with: {host: ${{ secrets.SERVER_HOST }}, username: ${{ secrets.SERVER_USER }}, key: ${{ secrets.SERVER_SSH_KEY }}, port: ${{ secrets.SERVER_SSH_PORT || 22 }}, script: "mkdir -p /opt/ai-story && cd /opt/ai-story && cat > docker-compose.yml << 'EOF'\nservices:\n  redis:\n    image: redis:7-alpine\n    restart: unless-stopped\n  backend:\n    image: ${{ env.DOCKERHUB_USERNAME }}/ai_story-backend:${{ env.IMAGE_VERSION }}\n    ports: ['8010:8010']\n    volumes: ['./data:/app/data']\n    environment:\n      - DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}\n      - REDIS_HOST=redis\n    depends_on: [redis]\n  frontend:\n    image: ${{ env.DOCKERHUB_USERNAME }}/ai_story-frontend:${{ env.IMAGE_VERSION }}\n    ports: ['3000:3000']\nEOF\ndocker compose up -d"}
